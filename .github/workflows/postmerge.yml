name: Task Tower postmerge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  shards:
    name: merge unittest shard (windows-latest, ${{ matrix.shard }})
    if: github.event.pull_request.merged == true
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m task_tower.ci_unittest --count 4 --index ${{ matrix.shard }} --manifest "${{ runner.temp }}/ci-unittest/shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-unittest-${{ github.run_id }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-unittest/shard-${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error
  verify-merge:
    name: verify-merge (windows-latest, windows)
    needs: shards
    if: always() && github.event.pull_request.merged == true
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        id: source
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        if: needs.shards.result == 'success'
        with:
          pattern: ci-unittest-${{ github.run_id }}-*
          path: ${{ runner.temp }}/ci-unittest
          merge-multiple: true
      - name: Verify all exact-merge test shards
        id: tests
        if: needs.shards.result == 'success'
        continue-on-error: true
        run: python -m task_tower.ci_unittest --verify "${{ runner.temp }}/ci-unittest" --count 4
      - name: Export task-manager event
        if: always() && steps.source.outcome == 'success' && steps.python.outcome == 'success'
        id: event
        shell: python
        env:
          TASK_REPOSITORY: ${{ github.repository }}
          TASK_PLATFORM: windows
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          import os, subprocess, sys
          subprocess.run([
              sys.executable, '-m', 'task_tower.merge_events',
              '--event', os.environ['GITHUB_EVENT_PATH'],
              '--repository', os.environ['TASK_REPOSITORY'],
              '--platform', os.environ['TASK_PLATFORM'],
              '--checks', 'passed' if os.environ['TEST_OUTCOME'] == 'success' else 'failed',
              '--run-id', os.environ['GITHUB_RUN_ID'],
              '--attempt', os.environ['GITHUB_RUN_ATTEMPT'],
              '--output', '.task-tower/merge-event.json',
          ], check=True)
      - uses: actions/upload-artifact@v4
        if: always() && steps.event.outcome == 'success'
        with:
          name: task-tower-merge-${{ github.event.pull_request.number }}-windows
          path: .task-tower/merge-event.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
      - name: Fail if postmerge tests failed
        if: always() && steps.tests.outcome != 'success'
        run: python -c "raise SystemExit(1)"
