name: Windows preconnect diagnostic

on:
  push:
    branches: [ci/diagnose-preconnect-budget]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-diagnostic:
    if: github.repository == 'Sibiya666/task-tower' && github.ref == 'refs/heads/ci/diagnose-preconnect-budget'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Measure the original contained Windows fixture
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python tools/windows_preconnect_diagnostic.py --output "${{ runner.temp }}/preconnect-diagnostic/report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-preconnect-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preconnect-diagnostic/report.json
          if-no-files-found: error
          retention-days: 7
