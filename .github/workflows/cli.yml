name: Diagnostic current POSIX containment (not release qualification)
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  native-controls:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actual scoped capture legacy ownership and receipt controls
        run: python -m unittest tests.test_posix_scope -v
      - name: Actual delayed cancellation watch controls with failure-only owned PID observation
        if: always()
        run: python tools/observe_posix_recovery.py
      - name: Actual strict SQLite shutdown recovery and normal-path guards
        if: always()
        run: python -m unittest tests.test_pipeline_shutdown_recovery -v
