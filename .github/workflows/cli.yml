name: Diagnostic POSIX recovery observation (not qualification)
on: [push]
permissions:
  contents: read
jobs:
  unittest:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/observe_posix_recovery.py
      - name: Observe actual SQLite path identity and read-only descriptor pin
        if: always()
        run: python tools/observe_db_pin.py --repo . --output "${{ runner.temp }}/pr42-db-pin" --cases 20
      - name: Retain bounded private fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr42-db-pin-${{ matrix.os }}
          path: ${{ runner.temp }}/pr42-db-pin
          retention-days: 7
          if-no-files-found: error
