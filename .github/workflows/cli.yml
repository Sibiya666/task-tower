name: Portable CLI
on:
  push:
    branches-ignore:
      - 'task-tower/claims/**'
  pull_request:
jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
