name: Diagnostic cancellation observation (not qualification)
on: [push]
jobs:
  unittest:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stop on first failure among 20 actual fixture cases
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, sys
          for attempt in range(20):
              print(f'Diagnostic attempt {attempt + 1}/20; stop on first failure', flush=True)
              result = subprocess.run([sys.executable, '-m', 'unittest',
                  'tests.test_pipeline_watch.WatchTests.test_lost_pr_response_is_unknown_and_restart_never_posts_again', '-v'])
              if result.returncode:
                  raise SystemExit(result.returncode)
          PY
