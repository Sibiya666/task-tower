name: Portable CLI
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: windows-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Classify the complete proposed merge
        id: classify
        run: python -m task_tower.ci_docs --scope --report "${{ runner.temp }}/ci-docs/scope.json" --github-output "$env:GITHUB_OUTPUT"
  shards:
    name: unittest shard (windows-latest, ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify job-local test temporary root
        shell: python
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          import os, tempfile
          from pathlib import Path
          try:
              actual = Path(tempfile.gettempdir()).resolve()
              expected = Path(os.environ['RUNNER_TEMP']).resolve()
          except (OSError, KeyError):
              raise SystemExit('Test temporary root is unavailable') from None
          if actual != expected:
              raise SystemExit('Unexpected test temporary root')
          print(len(actual.parents))
      - run: python -m task_tower.ci_unittest --count 4 --index ${{ matrix.shard }} --manifest "${{ runner.temp }}/ci-unittest/shard-${{ matrix.shard }}.json"
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-unittest-${{ github.run_id }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-unittest/shard-${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error
  unittest:
    name: unittest (windows-latest)
    needs: [scope, shards]
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        id: source
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - name: Validate documentation only (runtime tests not run)
        id: docs
        if: always() && needs.scope.result == 'success' && needs.scope.outputs.mode == 'docs' && needs.shards.result == 'skipped' && steps.source.outcome == 'success' && steps.python.outcome == 'success'
        run: python -m task_tower.ci_docs --validate --report "${{ runner.temp }}/ci-docs/validation.json" --repository "${{ github.repository }}" --pr ${{ github.event.pull_request.number }} --phase pr
      - uses: actions/upload-artifact@v4
        if: always() && steps.docs.outcome == 'success'
        with:
          name: task-tower-docs-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-docs/validation.json
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        if: needs.scope.result == 'success' && needs.scope.outputs.mode == 'full' && needs.shards.result == 'success'
        with:
          pattern: ci-unittest-${{ github.run_id }}-*
          path: ${{ runner.temp }}/ci-unittest
          merge-multiple: true
      - name: Verify complete exact-source coverage
        id: tests
        if: needs.scope.result == 'success' && needs.scope.outputs.mode == 'full' && needs.shards.result == 'success'
        run: python -m task_tower.ci_unittest --verify "${{ runner.temp }}/ci-unittest" --count 4
      - name: Fail if scope or required runtime route is incomplete
        if: always() && (needs.scope.result != 'success' || (needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'full') || (needs.scope.outputs.mode == 'full' && (needs.shards.result != 'success' || steps.tests.outcome != 'success')) || (needs.scope.outputs.mode == 'docs' && (needs.shards.result != 'skipped' || steps.docs.outcome != 'success')))
        run: python -c "raise SystemExit(1)"
  headless-container:
    name: headless container smoke (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build pinned orchestrator with default-deny context
        run: docker build -f deployment/headless/Dockerfile -t task-tower-headless:ci .
      - name: Verify disposable native Beads and persistent service volumes
        run: python deployment/headless/smoke.py --image task-tower-headless:ci --receipt "${{ runner.temp }}/headless-container/receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-container-${{ github.run_id }}
          path: ${{ runner.temp }}/headless-container/receipt.json
          if-no-files-found: error
