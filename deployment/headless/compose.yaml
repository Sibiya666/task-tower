services:
  orchestrator:
    build:
      context: ../..
      dockerfile: deployment/headless/Dockerfile
    image: task-tower-headless:stage6
    platform: linux/amd64
    ports:
      - "127.0.0.1:${TASK_TOWER_PORT:-8765}:8765"
    volumes:
      - beads:/data/beads
      - runtime:/data/runtime
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    stop_grace_period: 20s
    # Explicit foreground launch. No autostart or other host service is installed.
    restart: "no"
volumes:
  beads:
  runtime:
